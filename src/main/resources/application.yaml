spring:
  application:
    name: course-service

  config:
    # Nạp biến từ file .env (nếu có). Biến môi trường của hệ thống/Docker vẫn dùng được như bình thường.
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # chỉ phù hợp khi phát triển; production nên dùng Flyway/Liquibase
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
